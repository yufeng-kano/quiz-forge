# QuizForge db 服務設定。
#
# 只覆寫必要／有明確理由的項目；其餘沿用 postgres 編譯內建預設值。
# 由 docker-compose 以 `-c config_file=/etc/postgresql/postgresql.conf` 掛載套用。
# schema（含 `CREATE EXTENSION vector`）一律由 backend 的 Alembic migration 管理，
# 這裡不放任何 DDL / init script。

# container 對外網路必須能連線（同一個 compose network 內的 backend）。
listen_addresses = '*'

# 單人自架系統，連線數與記憶體用量給保守預設，之後量測到瓶頸再調整。
max_connections = 50
shared_buffers = 128MB
