# QuizForge proxy 純反向代理設定。
# 不 serve 任何靜態檔：`/` proxy 到 website（前端），`/api/v1` proxy 到 backend。

# 掃描 PDF 上傳可能很大，放大 body size 上限。
client_max_body_size 200m;

upstream backend {
    server backend:8000;
}

upstream website {
    server website:80;
}

server {
    listen 80;
    server_name _;

    location /api/v1/ {
        proxy_pass http://backend/v1/;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 出題／OCR 等長任務走輪詢，但單一 request（例如大檔上傳）也可能耗時，
        # 逾時值放寬。
        proxy_connect_timeout 75s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }

    # 前端靜態檔（含 SPA fallback）由 website container 負責。
    location / {
        proxy_pass http://website;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}