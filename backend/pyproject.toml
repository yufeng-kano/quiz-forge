[project]
name = "backend"
version = "0.1.0"
description = "QuizForge FastAPI backend"
readme = "README.md"
authors = [
    { name = "yu-feng", email = "60951976+IDK-Silver@users.noreply.github.com" }
]
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.19.1",
    "asyncpg>=0.31.0",
    "fastapi>=0.141.1",
    "greenlet>=3.5.5",
    "mammoth>=1.12.1",
    "markdownify>=1.2.3",
    "openai>=3.1.0",
    "pgvector>=0.5.0",
    "pillow>=12.3.0",
    "pydantic-settings>=2.15.0",
    "pymupdf>=1.28.2",
    "python-multipart>=0.0.32",
    "sqlalchemy>=2.0",
    "trafilatura>=2.2.0",
    "uvicorn[standard]>=0.52.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "basedpyright>=1.39.10",
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.3",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's `Depends(...)`/`Query(...)`/`File(...)` default-argument pattern
# is the framework's own dependency-injection idiom, not the mutable-default
# bug B008 exists to catch — this is ruff's documented allowlist for it.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.File"]

[tool.basedpyright]
include = ["src", "tests", "alembic"]
pythonVersion = "3.13"
typeCheckingMode = "standard"
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
