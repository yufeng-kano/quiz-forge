# QuizForge website 靜態檔案 serve 設定。
# 只 serve 前端 build 產物，不做任何 proxy（proxy 由 proxy container 負責）。

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 前端 SPA：找不到實體檔案就回 index.html，交給 vue-router 處理路由。
    location / {
        try_files $uri $uri/ /index.html;
    }
}