services:
  db:
    image: pgvector/pgvector:pg17
    container_name: quiz-forge-db
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      # bind mount 根目錄本身放了 .gitkeep，initdb 會誤判成「非空掛載點」；
      # 實際資料改放進掛載點底下的子目錄。
      PGDATA: /var/lib/postgresql/data/pgdata
    command: ["postgres", "-c", "config_file=/etc/postgresql/postgresql.conf"]
    volumes:
      - ./db/postgresql.conf:/etc/postgresql/postgresql.conf:ro
      - ./data/container-mounts/db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: quiz-forge-backend
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./data/container-mounts/uploads:${DATA_DIR}/uploads
      - ./data/container-mounts/assets:${DATA_DIR}/assets
      - ./data/container-mounts/exports:${DATA_DIR}/exports

  nginx:
    build:
      context: .
      dockerfile: nginx/Dockerfile
    container_name: quiz-forge-nginx
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${NGINX_HTTP_PORT}:80"
